name: Daily briefing

on:
  schedule:
    - cron: '0 22 * * *' # 07:00 KST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write # 실패 알림 이슈 생성용

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # push 트리거(코드 변경 배포)에서는 수집 생략 — cron/수동 실행에서만 수집
      - name: Run pipeline
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 저장소 Settings → Secrets and variables → Actions → Variables 에서 관리
          INTEREST_KEYWORDS: ${{ vars.INTEREST_KEYWORDS }}
          MAX_ARTICLES: ${{ vars.MAX_ARTICLES }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: npx tsx pipeline/run.ts

      - name: Commit collected data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "data: daily briefing $(TZ=Asia/Seoul date +%F)"
            git push
          fi

      - name: Build site
        env:
          SITE_BASE: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true # Pages 미활성 상태면 자동 활성화

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 실패하면 그날 브리핑이 조용히 비므로 이슈로 알림 (저장소 watch 설정에 따라 메일 발송).
      # 같은 제목의 열린 이슈가 있으면 코멘트만 추가해 이슈가 쌓이는 것을 방지.
      - name: Notify failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="Daily briefing 실패"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="$(TZ=Asia/Seoul date '+%F %R KST') 실행 실패 — 로그: ${RUN_URL}"
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label bug || gh issue create --title "$TITLE" --body "$BODY"
          fi
