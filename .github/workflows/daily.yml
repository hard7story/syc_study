name: Daily briefing

on:
  schedule:
    - cron: '0 22 * * *' # 07:00 KST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # push 트리거(코드 변경 배포)에서는 수집 생략 — cron/수동 실행에서만 수집
      - name: Run pipeline
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx pipeline/run.ts

      - name: Commit collected data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "data: daily briefing $(TZ=Asia/Seoul date +%F)"
            git push
          fi

      - name: Build site
        env:
          SITE_BASE: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true # Pages 미활성 상태면 자동 활성화

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
